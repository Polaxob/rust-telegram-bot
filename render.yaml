services:
  - type: web
    name: rust-player-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: STEAM_API_KEY
        sync: false
      - key: BM_API_KEY
        sync: false
